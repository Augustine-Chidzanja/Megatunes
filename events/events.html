<!DOCTYPE html>
<html>
    <head>
        <title>Events/Tours</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
        * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}
body {
    background-color: rgb(23, 23, 238);
    box-sizing: border-box;
    font-family: 'Times New Roman', Times, serif;
    padding: 0;
    margin: 0;
	background-image: url(C:/Users/AGGIE/Documents/trying/about/pic2e.jpeg);	
}          

/* NAVBAR */
.navbar {
  background: #131313;
  height: 60px;
  display: flex;
  justify-content: center;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 999;
  background-color: rgba(8, 4, 1, 0.856);
}

.navbar_container {
  display: flex;
  font-size: 1.3rem;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  max-width: 1300px;
  padding: 0 10px;
  margin:0px;
}

/* LOGO WITH GRADIENT */
.navbar_logo {
    width:100px;
    height:100px;
    display: flex;
    margin:0px;
    padding: 0px 0px;
}
/* NAV LINKS */
.navbar_menu {
  display: flex;
  list-style: none;
  align-items: center;
}

.navbar_item {
  height: 60px;
}

.navbar_links {
  color: #fff;
  text-decoration: none;
  padding: 0 1rem;
  display: flex;
  align-items: center;
  height: 100%;
}

.navbar_links:hover {
  background-color: wheat;
  color:rgba(8, 4, 1, 0.856);
  transition: all 0.3s ease;
}

.navbar_btn .button:hover {
  background: #4837ff;
  transition: all 0.3s ease;
}

/* HAMBURGER (hidden by default) */
.navbar_toggle {
  display: none;
  flex-direction: column;
  cursor: pointer;
}

.bar {
  height: 3px;
  width: 25px;
  background: #fff;
  margin: 4px 0;
  transition: 0.3s;
}

/* MOBILE RESPONSIVE */
@media screen and (max-width: 960px) {

  .navbar_toggle {
    display: flex;
    margin-right: 20px;
  }

  .navbar_menu {
    position: absolute;
    top: -600px;
    left: 0;
    width: 100%;
    flex-direction: column;
    transition: all 0.5s ease;
    opacity: 0%;
    z-index: -1;
  
  }
  .navbar_menu.active {
    top: 100%;
    opacity: 1;
    z-index: 99;
    height: 50%;
    font-size:1.6rem;   
  }
  .navbar_links {
    padding: 10px 10px;
    width: 100%;
    display: block;
    border:100%;
    border-radius: 7px;
    justify-content: center;
	background-color: #333;
  }
.navbar_links:hover {
  background-color:rgb(23, 23, 238);
  color:rgba(8, 4, 1, 0.856);
  transition: all 0.3s ease;
}
  .navbar_btn .button {
    width: 80%;
    margin: 0 auto 2rem auto;
  }

  #mobile-menu.is-active .bar:nth-child(2){
    opacity: 0;
  }
  #mobile-menu.is-active .bar:nth-child(1){
    transform: translateY(8px) rotate(45deg);
  }

  #mobile-menu.is-active .bar:nth-child(3){
    transform: translateY(-8PX) rotate(-45DEG);
  }
}


        </style>
        
    </head>
    <body>
  <nav class="navbar">
    <div class="navbar_container">
      <!-- LOGO -->
      <div class="navbar_logo">
        <img src="Images/Megatunes-png.png">
      </div>
      <div>
        <label for="Search"></label>
        <input id="mysearch" type="search" placeholder="Search">
      </div>

      <!-- HAMBURGER MENU -->
      <div class="navbar_toggle" id="mobile-menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>

      <!-- NAV LINKS -->
      <ul class="navbar_menu">
        <li class="navbar_item"><a href="../index.html" class="navbar_links">Home</a></li>
        <li class="navbar_item"><a href="trends.html" class="navbar_links">Trending</a></li>
        <li class="navbar_item"><a href="../music/music.html" class="navbar_links">Music</a></li>
        <li class="navbar_item"><a href="../music/albums.html" class="navbar_links">Albums</a></li>
        <li class="navbar_item"><a href="../online_store/onstore" class="navbar_links">Store</a></li>
        <li class="navbar_item"><a href="../music/bio.html" class="navbar_links">Artist Bio</a></li>
        <li class="navbar_item"><a href="../aboutus/aboutus.html" class="navbar_links">About Us</a></li>
      </ul>
    </div>
  </nav>
  <!-- JS -->
  <script src="../js/app.js"></script>
  <form>
  <label for="username">Username</label>
	<input type="text" value="Username">
  </form>
    </body>
</html>
